name: Tests

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # El core de NativePHP arrastra `endroid/qr-code`, que hoy exige PHP
        # ^8.5: por debajo de eso `composer install` no resuelve. El código del
        # plugin es 8.2-compatible, pero no se puede instalar sin el core.
        php: ['8.5']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Cache de Composer
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHPUnit
        run: composer test

      - name: Pint
        run: composer test:lint

  kotlin:
    name: Lógica Kotlin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Módulo JVM: compila ApkUpdaterLogic.kt (sin Android) y corre JUnit.
      - name: Tests de la lógica pura
        working-directory: tests/native
        run: ./gradlew test --no-daemon --console=plain
